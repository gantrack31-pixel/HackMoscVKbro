="64.0" y="186.4887268890914">Каждый тезис связан с источником</tspan></text><text font-family="Manrope, Arial" font-size="28.444444444444443" font-weight="400" fill="#475569"><tspan x="64.0" y="345.2440484449395">Цитата помогает найти основание утверждения. Совпадение текста не заменяет</tspan><tspan x="64.0" y="381.6529373338284">смысловую проверку.</tspan></text><text font-family="Manrope, Arial" font-size="16" font-weight="400" fill="#64748B"><tspan x="64.0" y="691.999100001125">06 / Deckly.Ai</tspan></text></svg></section><section><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280.0 719.999100001125" role="img"><rect x="0" y="0" width="1280.0" height="719.999100001125" fill="#FFFFFF"/><rect x="64.0" y="64.79991900010126" width="72" height="6" fill="#0077FF"/><text font-family="Manrope, Arial" font-size="56.888888888888886" font-weight="750" fill="#0077FF"><tspan x="64.0" y="186.4887268890914">Проверка показывает, что улучшить</tspan></text><text font-family="Manrope, Arial" font-size="28.444444444444443" font-weight="400" fill="#475569"><tspan x="64.0" y="345.2440484449395">Геометрия и плотность проверяются правилами. Смысл проверяет модель, когда</tspan><tspan x="64.0" y="381.6529373338284">она подключена.</tspan></text><text font-family="Manrope, Arial" font-size="16" font-weight="400" fill="#64748B"><tspan x="64.0" y="691.999100001125">07 / Deckly.Ai</tspan></text></svg></section><section><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280.0 719.999100001125" role="img"><rect x="0" y="0" width="1280.0" height="719.999100001125" fill="#FFFFFF"/><rect x="64.0" y="64.79991900010126" width="72" height="6" fill="#0077FF"/><text font-family="Manrope, Arial" font-size="56.888888888888886" font-weight="750" fill="#0077FF"><tspan x="64.0" y="186.4887268890914">Вы выбираете исправления</tspan></text><text font-family="Manrope, Arial" font-size="28.444444444444443" font-weight="400" fill="#475569"><tspan x="64.0" y="345.2440484449395">Изменения применяются к выбранным замечаниям. Предыдущую версию можно</tspan><tspan x="64.0" y="381.6529373338284">восстановить.</tspan></text><text font-family="Manrope, Arial" font-size="16" font-weight="400" fill="#64748B"><tspan x="64.0" y="691.999100001125">08 / Deckly.Ai</tspan></text></svg></section><section><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280.0 719.999100001125" role="img"><rect x="0" y="0" width="1280.0" height="719.999100001125" fill="#FFFFFF"/><rect x="64.0" y="64.79991900010126" width="72" height="6" fill="#0077FF"/><text font-family="Manrope, Arial" font-size="56.888888888888886" font-weight="750" fill="#0077FF"><tspan x="64.0" y="186.4887268890914">Результат можно редактировать</tspan></text><text font-family="Manrope, Arial" font-size="28.444444444444443" font-weight="400" fill="#475569"><tspan x="64.0" y="345.2440484449395">PPTX содержит текстовые блоки, таблицы и диаграммы. Также доступны PDF и HTML.</tspan></text><text font-family="Manrope, Arial" font-size="16" font-weight="400" fill="#64748B"><tspan x="64.0" y="691.999100001125">09 / Deckly.Ai</tspan></text></svg></section><section><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280.0 719.999100001125" role="img"><rect x="0" y="0" width="1280.0" height="719.999100001125" fill="#FFFFFF"/><rect x="64.0" y="64.79991900010126" width="72" height="6" fill="#0077FF"/><text font-family="Manrope, Arial" font-size="56.888888888888886" font-weight="750" fill="#0077FF"><tspan x="64.0" y="186.4887268890914">Следующий шаг — проверить на своих</tspan><tspan x="64.0" y="259.30650466686916">данных</tspan></text><text font-family="Manrope, Arial" font-size="28.444444444444443" font-weight="400" fill="#475569"><tspan x="64.0" y="345.2440484449395">Загрузите незнакомый шаблон, добавьте материал и оцените результат.</tspan></text><text font-family="Manrope, Arial" font-size="16" font-weight="400" fill="#64748B"><tspan x="64.0" y="691.999100001125">10 / Deckly.Ai</tspan></text></svg></section></html>
