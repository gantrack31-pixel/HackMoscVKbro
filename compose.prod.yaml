# Production: Caddy (HTTPS, gzip/zstd) -> deckly. Port 8000 is never published;
# only Caddy reaches the app over the internal network.
# Usage: docker compose -f compose.prod.yaml up -d --build
services:
  deckly:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      STORAGE_PATH: data
      DATABASE_PATH: data/deckly.sqlite3
      # Read by uvicorn directly. 2 workers is safe with SQLite WAL on one host;
      # each worker runs up to 2 generations at once (generation_slots).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Trust X-Forwarded-For from Caddy so per-IP rate limits see real clients.
      # Safe only because port 8000 is not published outside the compose network.
      FORWARDED_ALLOW_IPS: "*"
    expose:
      - "8000"
    volumes:
      - deckly-data:/app/backend/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      deckly:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (e.g. deckly.example.ru)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  deckly-data:
  caddy-data:
  caddy-config:
